
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>キーボードで動かす</title>

  <style>
    .stage {
      position: relative;
      width: 600px;
      height: 240px;
      margin: 24px auto;
      border: 2px solid #333;
      background: #f6f8ff;
      overflow: hidden;
    }

    #box {
      position: absolute;
      width: 48px;
      height: 48px;
      background-color: #ff6b6b;
      border-radius: 8px;
    }

    /* 色を変えるクラス */
    #box.changeColor {
      background-color: #4dabf7;
    }
  </style>
</head>

<body>
  <p style="text-align: center">
    ← / → / ↑ / ↓ で移動、Cで色変更
  </p>

  <div class="stage" id="stage">
    <div id="box"></div>
  </div>

  <script>
    const box = document.getElementById("box");

    let x = 50;
    let y = 96;

    const speed = 4;
    const keys = {};

    document.addEventListener("keydown", (e) => {
      // Cキーを押すたびに色を切り替える
      if (e.code === "KeyC" && !e.repeat) {
        box.classList.toggle("changeColor");
      }

      keys[e.code] = true;
    });

    document.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    function draw() {
      box.style.left = x + "px";
      box.style.top = y + "px";
    }

    function update() {
      if (keys["ArrowRight"]) x += speed;
      if (keys["ArrowLeft"]) x -= speed;
      if (keys["ArrowDown"]) y += speed;
      if (keys["ArrowUp"]) y -= speed;

      // 移動範囲を制限
      if (x < 0) x = 0;
      if (x > 600 - 48) x = 600 - 48;
      if (y < 0) y = 0;
      if (y > 240 - 48) y = 240 - 48;

      draw();
    }

    draw();
    setInterval(update, 16);
  </script>
</body>
</html>
